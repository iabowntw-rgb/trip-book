<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E5E6F"><meta name="description" content="出國旅程本：待辦、行程、機票住宿、記帳和打包清單，一本搞定。"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="旅程本"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}</style><script>window.TB_WEB=true</script></head><body><title>出國旅程本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column of "passport pages" — a summary hero for the next trip, then trip list; trip detail uses tabs. Flights render as boarding-pass stubs. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --ink: #172031;
  --muted: #5B6677;
  --line: #D6DCE4;
  --accent: #0E5E6F;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEDEF;
  --bad: #B4322E;
  --bad-soft: #F8E1DF;
  --warn: #965A00;
  --warn-soft: #FBEBD0;
  --ok: #2E7D4F;
  --ok-soft: #DDF0E3;
  --shadow: 0 1px 2px rgba(23,32,49,.06), 0 4px 16px rgba(23,32,49,.05);
  --f-display: "Noto Serif TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --line-strong: #B9C2CE;
  --btn-edge: #AEB8C5;
  --field-edge: #8A94A3;
  /* country cover colours (red is kept for urgent/over-budget only): soft fill + ink */
  --jp-soft: #E5E9F8; --jp-ink: #34489A;
  --vn-soft: #DFF0E2; --vn-ink: #25683D;
  --th-soft: #FBEBCB; --th-ink: #855000;
  --xx-soft: #DCEDEF; --xx-ink: #0E5E6F;
}
/* dark: three clear layers — page, card, raised — and covers become a coloured edge instead of a filled block */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1116; --surface: #161C24; --surface-2: #212A35; --ink: #E8ECF1; --muted: #9AA6B6; --line: #2C3644; --line-strong: #46536A; --btn-edge: #0A0D11; --field-edge: #7D8899;
  --accent: #5FB3C4; --accent-ink: #0B1A1E; --accent-soft: #17343B;
  --bad: #F07A72; --bad-soft: #3A1E1D; --warn: #E3A846; --warn-soft: #382A12; --ok: #6CC08D; --ok-soft: #173023;
  --jp-soft: #212A35; --jp-ink: #9DAEF2; --vn-soft: #212A35; --vn-ink: #8FD3A3; --th-soft: #212A35; --th-ink: #EBC277; --xx-soft: #212A35; --xx-ink: #8CCFDC;
  --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1116; --surface: #161C24; --surface-2: #212A35; --ink: #E8ECF1; --muted: #9AA6B6; --line: #2C3644; --line-strong: #46536A; --btn-edge: #0A0D11; --field-edge: #7D8899;
  --accent: #5FB3C4; --accent-ink: #0B1A1E; --accent-soft: #17343B;
  --bad: #F07A72; --bad-soft: #3A1E1D; --warn: #E3A846; --warn-soft: #382A12; --ok: #6CC08D; --ok-soft: #173023;
  --jp-soft: #212A35; --jp-ink: #9DAEF2; --vn-soft: #212A35; --vn-ink: #8FD3A3; --th-soft: #212A35; --th-ink: #EBC277; --xx-soft: #212A35; --xx-ink: #8CCFDC;
  --shadow: none; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.amt-row input::-webkit-outer-spin-button, .amt-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.amt-row input { -moz-appearance: textfield; appearance: textfield; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
/* 大字模式: scale the whole page so every px size grows together */
html.big { zoom: 1.15; }
html.big .hbub { width: min(320px, calc(100vw / 1.15 - 32px)); }
html.big #helpHint { width: min(260px, calc(100vw / 1.15 - 32px)); }
/* viewport units are zoomed too, so dialogs divide them back to fit the screen */
html.big dialog { width: min(560px, calc(100vw / 1.15 - 32px)); max-height: calc(100vh / 1.15 - 32px); }
html.big #showDlg { width: calc(100vw / 1.15); height: calc(100vh / 1.15); max-width: none; max-height: none; }
html.big .sheet-top h2 { font-size: 17px; }
@media (max-width: 720px) { html.big #sheet { width: calc(100vw / 1.15); max-height: calc(94vh / 1.15); } }
.app { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 38px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-size: 15px; }
.brand b { font-family: var(--f-display); font-size: 20px; letter-spacing: .04em; }

/* buttons */
/* buttons read as buttons: a filled primary, raised secondaries with a bottom edge, and plain text links for minor "open ↗" actions */
.btn, .btn-sm { border: 1px solid var(--field-edge); background: var(--surface-2); box-shadow: 0 2px 0 var(--btn-edge); border-radius: 10px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--ink); white-space: nowrap; transition: transform .06s, box-shadow .06s; }
.btn { min-height: 42px; padding: 8px 16px; }
.btn-sm { min-height: 36px; padding: 5px 12px; font-size: 14px; }
.btn:hover, .btn-sm:hover { border-color: var(--accent); }
.btn:active, .btn-sm:active { transform: translateY(2px); box-shadow: 0 0 0 var(--btn-edge); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 2px 0 #08404B; font-weight: 700; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; }
.btn.ghost:hover { border-color: var(--line-strong); }
.btn.danger, .btn-sm.danger { color: var(--bad); }
.lnk { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; padding: 2px 0; }
.lnk:hover { text-decoration: underline; }
.icon-btn { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; font-size: 18px; line-height: 1; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--bad); }
body.ro .w { display: none !important; }

/* stamp: country code in a passport-stamp box */
.stamp { flex: none; width: 52px; height: 52px; border: 2px solid var(--accent); color: var(--accent); border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 15px; letter-spacing: .06em; transform: rotate(-8deg); }
.stamp.sm { width: 40px; height: 40px; font-size: 12px; }

/* chips */
.chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.tag { font-size: 12px; color: var(--muted); letter-spacing: .03em; }

/* card */
.card { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.section-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-h h2 { font-size: 17px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }

/* hero */
.hero { display: flex; flex-direction: column; gap: 16px; }
.hero-main { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.hero-title { flex: 1; min-width: 200px; }
.hero-title h1 { font-family: var(--f-display); font-size: 28px; line-height: 1.25; }
.count { text-align: right; }
.count b { display: block; font-family: var(--f-mono); font-size: 44px; line-height: 1; color: var(--accent); }
.count span { font-size: 13px; color: var(--muted); }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.progress > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.progress-row { display: flex; flex-direction: column; gap: 6px; }
.hero-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.hero-grid > * { min-width: 0; }
.glance { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.glance > * { min-width: 0; }
.travelers { display: flex; gap: 6px; flex-wrap: wrap; }
.person { font-size: 12px; padding: 1px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }

/* todos */
.todos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.todo { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.todo:last-child { border-bottom: 0; }
.check { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 7px; border: 2px solid var(--field-edge); background: var(--surface); color: transparent; font-size: 14px; font-weight: 700; display: grid; place-items: center; padding: 0; }
.check:hover { border-color: var(--accent); }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
body.ro .check { pointer-events: none; }
.todo-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.todo-title { font-weight: 500; }
.todo.is-done .todo-title { color: var(--muted); text-decoration: line-through; }
.todo-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }

/* todo cards */
.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tcard { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px; cursor: pointer; min-width: 0; transition: opacity .22s, transform .22s, border-color .15s; }
.hero .tcard { background: var(--surface-2); }
.tcard:hover { border-color: var(--accent); }
body.ro .tcard { cursor: default; }
.tc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tc-top { display: flex; justify-content: space-between; align-items: center; min-height: 18px; }
.tc-title { font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.tc-note { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tc-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-top: 2px; }
.grip { color: var(--muted); font-size: 16px; line-height: 1; cursor: grab; padding: 0 2px; }
.tcard.is-done .tc-title { color: var(--muted); text-decoration: line-through; }
.tcard.leaving { opacity: 0; transform: scale(.96); }
.done-sec { display: flex; flex-direction: column; gap: 10px; }
.done-toggle { align-self: flex-start; border: 0; background: none; color: var(--muted); font-weight: 500; padding: 10px 2px; margin: -6px 0; }
.done-toggle:hover { color: var(--accent); }
[data-sortable] .tcard { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.drag-ghost { opacity: .35; }
.drag-chosen { box-shadow: 0 8px 24px rgba(23,32,49,.18); border-color: var(--accent); }

/* status filters + sort toggle */
.todo-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.filters-wrap { min-width: 0; max-width: 100%; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 2px; }
.filter { border: 1px solid var(--field-edge); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 14px; color: var(--muted); }
.filter .n { font-family: var(--f-mono); font-size: 12px; margin-left: 6px; }
.filter.has-bad .n { color: var(--bad); font-weight: 600; }
.filter[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filter[aria-selected="true"] .n { color: inherit; }
.todo-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--field-edge); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

/* itinerary */
.days { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.day-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.plans { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-height: 28px; }
.plan { display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 9px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid transparent; cursor: pointer; min-width: 0; }
.plan:hover { border-color: var(--accent); }
.plan.auto { background: transparent; border: 1px dashed var(--line); }
[data-plans] .plan:not(.auto) { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.p-time { font-size: 13px; color: var(--muted); padding-top: 1px; }
.p-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.p-title { font-weight: 600; overflow-wrap: anywhere; }
.p-type { font-size: 11px; font-weight: 500; color: var(--accent); margin-right: 6px; letter-spacing: .04em; }
.add-plan { align-self: flex-start; }
.day-chips { display: none; overflow-x: auto; gap: 6px; padding-block: 2px; }
.day-chips > * { flex: none; }

/* money */
.money-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.pc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: start; }
.pc.wide { grid-column: 1 / -1; }
.pc-h { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-height: 44px; }
.pc-h > :not(.pc-fold) { margin-left: auto; }
.pc-fold { border: 0; background: none; color: inherit; font: inherit; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px; margin-left: -8px; border-radius: 8px; text-align: left; cursor: pointer; }
.pc.plain .pc-fold { font-size: 18px; }
.pc-fold:hover { background: var(--surface-2); }
.pc-ar { width: 14px; color: var(--muted); font-size: 13px; }
.pc-sum { color: var(--muted); font-size: 15px; text-align: right; }
.pc.folded { gap: 0; }
.card.pc.folded { padding-top: 8px; padding-bottom: 8px; }
.pc-h > .todo-tools { flex: 1 1 100%; margin-left: 0; display: flex; gap: 8px; }
.pc-h > .todo-tools select { flex: 1; min-width: 0; }
.pc-foot { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.rate-hist summary { cursor: pointer; padding: 8px 0; min-height: 44px; display: flex; align-items: center; }
.hint { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hint-x { border: 1px solid var(--field-edge); background: none; color: inherit; font: inherit; font-size: 13px; border-radius: 999px; padding: 4px 10px; min-height: 32px; cursor: pointer; }
.big { font-family: var(--f-mono); font-size: 30px; font-weight: 600; line-height: 1.15; }
.progress.over > div { background: var(--bad); }
.bad-t { color: var(--bad); }
.cash-row { display: flex; flex-direction: column; }
.cash-row b { font-size: 18px; }
.cash-ex { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details summary { cursor: pointer; }
.settle { display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.daybars { display: flex; gap: 6px; align-items: flex-end; height: 120px; overflow-x: auto; }
.db { flex: 1; min-width: 30px; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
.db-bar { flex: 1; width: 100%; display: flex; align-items: flex-end; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.db-bar div { width: 100%; background: var(--accent); border-radius: 6px 6px 0 0; }
.rwall { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.rwall .thumb, .rwall .thumb-pdf { width: 100%; height: auto; aspect-ratio: 1; max-width: 100%; }
.exp { cursor: pointer; border-radius: 8px; }
.exp:hover .exp-body > div:first-child { color: var(--accent); }
.stat-row { display: grid; grid-template-columns: minmax(150px, 1.2fr) 2fr auto auto; gap: 12px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 0; }
.stat-row:last-child { border-bottom: 0; }
.stat-name { display: flex; flex-direction: column; min-width: 0; }
.stat-row .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: block; }
.stat-row .bar span { display: block; height: 100%; background: var(--accent); }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* floating quick-add + sheet */
.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; border: 0; border-radius: 999px; padding: 13px 20px; background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: 0 6px 20px rgba(14,94,111,.35); }
body.has-fab .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
body.has-fab .app { padding-bottom: 96px; }
#sheet { width: min(560px, 100%); }
#sheetForm { padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sheet-h h2 { font-family: var(--f-display); font-size: 20px; }
.photo-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.photo-btn { cursor: pointer; }
.drop { border: 2px dashed var(--line-strong); border-radius: 12px; background: var(--surface-2); padding: 14px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop-fine { display: block; text-align: center; cursor: pointer; color: var(--ink); font-size: 15px; line-height: 1.6; padding: 6px 0; }
.drop-touch { display: none; gap: 8px; flex-wrap: wrap; }
.drop-full { display: flex; align-items: center; gap: 12px; }
.drop-full[hidden], .drop-empty[hidden] { display: none; }
.drop-full img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.drop-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.drop-thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
.drop-thumbs:not(:empty) + .drop-empty { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.dthumb { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.dthumb img, .dthumb .thumb-pdf { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.drm { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--ink); color: var(--surface); font-size: 13px; line-height: 26px; padding: 0; }
.dfirst { font-size: 12px; padding: 3px 8px; }
.dbadge { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; pointer-events: none; }
.dthumb .dbadge { bottom: auto; top: 4px; }
.shop-thumb, .thumb-a { position: relative; display: block; flex: none; }
.drop-count { font-weight: 400; }

@media (pointer: coarse) { .drop-fine, .fine-only { display: none; } .drop-touch { display: flex; } }

.amt-row { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--accent); padding-bottom: 4px; }

.qe-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

/* show mode: deliberately a fixed white sheet in both themes, so codes scan and text reads at arm's length */

.show-bar { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: #FFFFFF; border-bottom: 1px solid #E3E6EA; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.show-bar b { font-size: 18px; }
.show-bar button { font-size: 16px; border: 1px solid #C9CED6; background: #FFFFFF; color: #111111; border-radius: 10px; padding: 8px 14px; }
.show-body { display: flex; flex-direction: column; gap: 16px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; }
.slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.show-img { width: 100%; max-height: 72vh; object-fit: contain; background: #FFFFFF; border: 1px solid #E3E6EA; border-radius: 8px; }
.si-row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.si-big { font-size: 34px; font-weight: 700; }

#showDlg .btn { background: #FFFFFF; color: #111111; border-color: #C9CED6; }
#showDlg .btn.primary { background: #0E5E6F; color: #FFFFFF; border-color: #0E5E6F; }
#showDlg .btn.danger { color: #B4322E; }
.drv-name { font-size: 32px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.drv-addr { font-size: 26px; line-height: 1.5; overflow-wrap: anywhere; user-select: all; }
.sos-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E3E6EA; flex-wrap: wrap; }
.sos-num { font-family: var(--f-mono); font-size: 30px; font-weight: 700; user-select: all; }
.fx-in { font-family: var(--f-mono); font-size: 36px; font-weight: 600; width: 100%; border: 0; border-bottom: 2px solid #0E5E6F; border-radius: 0; background: #FFFFFF; color: #111111; padding: 4px 0; }
.fxchip { border: 1px solid #C9CED6; background: #FFFFFF; color: #444444; border-radius: 999px; padding: 6px 14px; font-size: 15px; }
.fxchip[aria-pressed="true"] { background: #DCEDEF; color: #0E5E6F; border-color: #0E5E6F; font-weight: 600; }

/* boarding pass */
.pass { display: grid; grid-template-columns: 1fr auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; position: relative; min-width: 0; }
.pass-main { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pass-stub { padding: 14px 16px; border-left: 2px dashed var(--line); display: flex; flex-direction: column; gap: 4px; justify-content: center; min-width: 120px; }
.pass::before, .pass::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); right: calc(120px + 32px - 9px); }
.pass::before { top: -9px; }
.pass::after { bottom: -9px; }
.pass-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }

.route { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.route .code { font-family: var(--f-mono); font-size: 26px; font-weight: 600; line-height: 1.1; }

.route .arrow { color: var(--muted); font-size: 18px; }

.label { font-size: 11px; letter-spacing: .12em; color: var(--muted); }
.pnr { font-family: var(--f-mono); font-size: 20px; font-weight: 600; letter-spacing: .08em; }
.copy { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 0; text-align: left; }

/* stay */
.stay { display: flex; flex-direction: column; gap: 8px; }
.stay h3 { font-size: 17px; }
.stay-dates { display: flex; gap: 18px; flex-wrap: wrap; }
.kv { display: flex; flex-direction: column; }
.kv b { font-weight: 500; }

/* lists / grids */
.stack { display: flex; flex-direction: column; gap: 12px; }
.trip-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.trip-card { text-align: left; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }

.trip-card h3 { font-family: var(--f-display); font-size: 18px; }

/* trip detail */
.trip-head { display: flex; flex-direction: column; gap: 12px; }
.back { align-self: flex-start; border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; }

.tabs-wrap { overflow-x: auto; overflow-y: hidden; border-bottom: 1px solid var(--line); }

#bnav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); grid-template-columns: repeat(var(--n, 5), 1fr); }
.bn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px 8px; font-size: 13px; font-weight: 500; border: 0; background: none; color: var(--muted); min-height: 56px; }

.bn svg { box-sizing: content-box; padding: 3px 16px; border-radius: 999px; transition: background .15s; width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.trip-top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; background: var(--bg); padding: 10px 0; margin: -10px 0 0; }

.trip-mini { --cc-ink: var(--xx-ink); display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--field-edge); border-left: 6px solid var(--cc-ink); border-radius: 0 12px 12px 0; padding: 8px 10px 8px 12px; }
.trip-mini.cc-JP { --cc-ink: var(--jp-ink); } .trip-mini.cc-VN { --cc-ink: var(--vn-ink); } .trip-mini.cc-TH { --cc-ink: var(--th-ink); }
.tm-main { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm-main b { font-size: 16px; margin-right: 6px; }
.trip-mini .btn-sm { flex: none; }
.trip-menu { display: flex; flex-direction: column; gap: 10px; }
.trip-menu .tm-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qtoggle { align-self: flex-start; border: 0; background: none; color: var(--accent); font-weight: 500; font-size: 15px; padding: 10px 2px; margin: -10px 0; }
.trip-phone { display: flex; flex-direction: column; gap: 12px; margin: 4px 0 20px; }
/* inside a trip on a phone the page header keeps only the brand and 說明 */
@media (max-width: 720px) { body.in-trip .top-actions { display: none; } }
.tab-body { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.tab-body.anim { animation: tbIn .15s ease-out; }
@keyframes tbIn { from { opacity: 0; transform: translateX(14px); } }
.hero-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-acts .btn { flex: 1; min-width: 140px; }
.cover[data-act] { cursor: pointer; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: -18px; z-index: 2; background: var(--surface); padding: 18px 0 8px; margin-top: -18px; }
.sheet-top h2 { font-family: var(--f-display); font-size: 19px; text-align: center; flex: 1; }
.amt-ok { flex: none; min-width: 52px; font-size: 20px; }
.tabs { display: flex; gap: 4px; min-width: max-content; }
.tab { border: 0; background: none; padding: 10px 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--f-mono); font-size: 12px; margin-left: 4px; }
.show-done { border: 0; background: none; color: var(--muted); padding: 8px 0; font-size: 13px; }

/* expenses */
.exp-sum { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
.exp-sum .big { font-family: var(--f-mono); font-size: 30px; font-weight: 600; }
.cat-bars { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 220px; }
.cat-bar { display: grid; grid-template-columns: 48px 1fr 90px; gap: 8px; align-items: center; font-size: 13px; }
.cat-bar .bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.cat-bar .bar div { height: 100%; background: var(--accent); }
.cat-bar span:last-child { text-align: right; }
.exp { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.exp:last-child { border-bottom: 0; }
.exp-body { flex: 1; min-width: 0; }

.thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); display: block; }
.thumb-pdf { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; font-family: var(--f-mono); text-decoration: none; }

/* rates */
.rates-strip { display: flex; gap: 10px; flex-wrap: wrap; }
.rate-pill { display: flex; flex-direction: column; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 130px; }
.rate-pill b { font-family: var(--f-mono); font-size: 17px; }
.calc { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
.calc .arrow { padding-bottom: 10px; color: var(--muted); }
.table-wrap { overflow-x: auto; }

/* empty / status */
.empty { text-align: center; padding: 36px 18px; display: flex; flex-direction: column; gap: 10px; align-items: center; }

.toast button { flex: none; white-space: nowrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }
.help { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

/* form dialog */
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(560px, calc(100% - 32px)); background: var(--surface); color: var(--ink); max-height: calc(100% - 32px); }

.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--field-edge); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { min-height: 64px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* country covers (trip cards, hero, trip head) */
.cover { --cc-soft: var(--xx-soft); --cc-ink: var(--xx-ink); background: var(--cc-soft); color: var(--ink); border-left: 6px solid var(--cc-ink); border-radius: 0 12px 12px 0; padding: 14px 16px; }
.cover.cc-JP { --cc-soft: var(--jp-soft); --cc-ink: var(--jp-ink); }
.cover.cc-VN { --cc-soft: var(--vn-soft); --cc-ink: var(--vn-ink); }
.cover.cc-TH { --cc-soft: var(--th-soft); --cc-ink: var(--th-ink); }
.cover .stamp { border-color: var(--cc-ink); color: var(--cc-ink); }
.cover .count b, .cover .eyebrow { color: var(--cc-ink); }
.cover.photo { color: #FFFFFF; background-color: #222; background-size: cover; background-position: center; border-left-color: rgba(255,255,255,.7); }
.cover.photo .stamp, .cover.photo .count b, .cover.photo .eyebrow, .cover.photo .muted, .cover.photo .count span { color: #FFFFFF; border-color: #FFFFFF; }
.trip-card { padding: 0; overflow: hidden; gap: 0; }
.trip-card .cover { border-radius: 0; }
.trip-card .tc-foot { padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
.trip-card.past .cover { opacity: .85; }

/* home sections */
.hsec { display: flex; flex-direction: column; gap: 10px; }
.hsec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hsec-h h2 { font-size: 17px; display: flex; align-items: center; gap: 8px; }
.hsec-h .fold { border: 0; background: none; color: inherit; font: inherit; padding: 2px 4px; margin-left: -4px; border-radius: 6px; text-align: left; }
.hsec-h .fold:hover { background: var(--surface-2); }
.hsec-sum { font-size: 13px; color: var(--muted); font-weight: 400; }
.msum { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.msum b { font-family: var(--f-mono); font-size: 18px; }
.home-tools { display: flex; justify-content: center; }
.urgent-chip { border: 0; cursor: pointer; }
.web-a2hs { border: 2px solid var(--accent); }
.web-a2hs h2, .web-backup h2 { font-size: 18px; margin: 0 0 8px; }
.web-a2hs p, .web-backup p { margin: 0 0 8px; }
.web-backup { margin-top: 8px; }
/* undo toast, "more fields", share cards */
.toast { display: flex; align-items: center; gap: 14px; }
/* help mode: dashed boxes over each section; tapping one explains it instead of using it */
#helpBar { position: fixed; top: 0; left: 0; right: 0; z-index: 70; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: var(--accent); color: var(--accent-ink); font-size: 14px; }
#helpBar[hidden] { display: none; }
#helpBar .btn { background: var(--accent-ink); color: var(--accent); border-color: transparent; flex: none; }
body.helping { padding-top: 64px; }
#helpLayer { position: absolute; top: 0; left: 0; width: 0; height: 0; }
.hbox { position: absolute; z-index: 32; border: 2.5px dashed var(--accent); border-radius: 12px; background: color-mix(in srgb, var(--accent) 9%, transparent); cursor: help; padding: 0; }
.hbox.fixed { position: fixed; z-index: 41; }
.hbox.on { border-style: solid; background: color-mix(in srgb, var(--accent) 18%, transparent); }
.hbox i { position: absolute; top: -11px; right: -11px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 700 14px/24px var(--f-body); font-style: normal; text-align: center; }
.hbub { position: absolute; z-index: 60; width: min(320px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border: 2px solid var(--accent); border-radius: 14px; padding: 14px 16px; box-shadow: 0 8px 28px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 8px; }
.hbub.fixed { position: fixed; }
.hbub h3 { font-size: 16px; }
.hbub p { font-size: 15px; line-height: 1.6; }
.hbub .btn { align-self: flex-end; }
#helpHint { position: absolute; z-index: 46; width: min(260px, calc(100vw - 32px)); background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 10px 12px; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.5; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
#helpHint::before { content: ''; position: absolute; top: -7px; right: var(--ax, 24px); border: 7px solid transparent; border-top: 0; border-bottom-color: var(--accent); }
#helpHint button { border: 0; background: none; color: inherit; font-size: 16px; padding: 0 2px; flex: none; }
#helpBtn { order: 3; }
.top-actions { margin-left: auto; }
@media (max-width: 720px) { #helpBtn { order: 1; margin-left: auto; } .top-actions { order: 2; width: 100%; } }
#helpBtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.toast button { border: 0; background: none; color: var(--accent-soft); font-weight: 700; padding: 4px 2px; text-decoration: underline; }
.more-f { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 8px; }

function twdPer(cur) { if (cur === 'TWD') return 1; const r = S.rates?.rates?.[cur]; return r ? 1 / r : null; }

// ---------- money ----------
// TWD per unit, from what the trip actually paid at the exchange counter
function cashRate(t, cur) {
  let amt = 0, twd = 0;
  items(t.cash).forEach(c => { if (c.cur === cur && c.amount > 0 && c.twd > 0) { amt += c.amount; twd += c.twd; } });
  return amt ? twd / amt : null;
}
// an expense in TWD: actual card charge > cash exchange rate > rate saved when recorded > today's rate
function expTWDraw(t, e) {
  if (e.twdActual) return e.twdActual;
  const cur = e.cur || 'TWD'; if (cur === 'TWD') return e.amount || 0;
  const r = (e.pay === 'cash' && cashRate(t, cur)) || e.rate || twdPer(cur);
  return r == null ? null : (e.amount || 0) * r;
}
// rounded the way it is shown, so the rows on screen always add up to the total shown
function expTWD(t, e) {
  const r = twdPer(S.dispCur);
  if ((e.cur || 'TWD') === S.dispCur && r) return (e.amount || 0) * r; // shown in its own currency: exactly what was paid
  const v = expTWDraw(t, e); if (v == null || !r) return v;
  const f = 10 ** decOf(S.dispCur); return Math.round(v / r * f) / f * r;
}
function fmtDisp(twd) {
  const c = S.dispCur, r = twdPer(c);
  if (twd == null || !r) return '—';
  return cur$(twd / r, c);
}
function cashLeft(t) {
  const m = {};
  items(t.cash).forEach(c => { m[c.cur] = (m[c.cur] || 0) + (c.amount || 0); });
  items(t.expenses).forEach(e => { if (e.pay === 'cash' && e.cur in m) m[e.cur] -= e.amount || 0; });
  return m;
}
const sumPaid = (t, p) => items(t.expenses).reduce((s, e) => (e.paidBy || '我') === p ? s + (expTWD(t, e) || 0) : s, 0);
function spent(t) {
  let total = 0, todayT = 0;
  items(t.expenses).forEach(e => { const v = expTWD(t, e); if (v == null) return; total += v; if (e.date === today()) todayT += v; });
  const budget = t.budget && t.budget.amount ? t.budget.amount * (twdPer(t.budget.cur || 'TWD') || 0) : 0;
  return { total, todayT, budget, n: items(t.expenses).length };
}
// who owes whom, in TWD, settled greedily so the fewest transfers remain
function settle(t) {
  const ps = people(t), bal = Object.fromEntries(ps.map(p => [p, 0]));
  items(t.expenses).forEach(e => {
    const v = expTWD(t, e); if (v == null) return;
    const payer = e.paidBy || '我', split = e.split && e.split.length ? e.split : ps;
    bal[payer] = (bal[payer] || 0) + v;
    split.forEach(p => { bal[p] = (bal[p] || 0) - v / split.length; });
  });
  const debt = Object.entries(bal).filter(([, v]) => v < -1).map(([p, v]) => [p, -v]).sort((a, b) => b[1] - a[1]);
  const cred = Object.entries(bal).filter(([, v]) => v > 1).map(([p, v]) => [p, v]).sort((a, b) => b[1] - a[1]);
  const moves = [];
  for (let i = 0, j = 0; i < debt.length && j < cred.length;) {
    const x = Math.min(debt[i][1], cred[j][1]);
    moves.push([debt[i][0], cred[j][0], x]);
    debt[i][1] -= x; cred[j][1] -= x;
    if (debt[i][1] < 1) i++; if (cred[j][1] < 1) j++;
  }
  return moves;
}

// ---------- itinerary ----------
// trip days, stretched to cover any plan or flight that falls outside them
function tripDayList(t) {
  let a = t.start, b = t.end;
  const see = d => { if (d && d.length === 10) { if (d < a) a = d; if (d > b) b = d; } };
  items(t.plans).forEach(p => see(p.day));
  items(t.flights).forEach(f => { see((f.depart || '').slice(0, 10)); see((f.arrive || '').slice(0, 10)); });
  const out = [];
  for (let d = a; d <= b && out.length < 60; d = addDays(d, 1)) out.push(d);
  return out;
}
function dayEntries(t, day) {
  const auto = [], up = s => (s || '').toUpperCase();
  items(t.flights).forEach(f => {
    if ((f.depart || '').slice(0, 10) === day) auto.push({ auto: 'flight', time: f.depart.slice(11, 16), title: `${f.flightNo || '航班'} 起飛 ${up(f.from)} → ${up(f.to)}`, type: 'move', airport: up(f.from) });
    if ((f.arrive || '').slice(0, 10) === day) auto.push({ auto: 'flight', time: f.arrive.slice(11, 16), title: `${f.flightNo || '航班'} 抵達 ${up(f.to)}`, type: 'move', airport: up(f.to) });
  });
  items(t.stays).forEach(s => {
    if (s.checkin === day) auto.push({ auto: 'stay', time: '', title: `入住 ${s.name || '住宿'}`, type: 'stay', place: s.address });
    if (s.checkout === day) auto.push({ auto: 'stay', time: '', title: `退房 ${s.name || '住宿'}`, type: 'stay', place: s.address });
  });
  return [...auto, ...items(t.plans).filter(p => p.day === day)].sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
}
// Japan has good transit data in Google Maps; Vietnam and Thailand mostly don't, so route by car (≈ Grab)
const travelMode = t => ['VN', 'TH'].includes(t.country) ? 'driving' : 'transit';
const placeOf = (t, p) => p.place || (p.airport ? p.airport + ' airport' : '');
function routeUrl(t, places) {
  const u = new URL('https://www.google.com/maps/dir/');
  u.searchParams.set('api', '1');
  if (places.length > 1) u.searchParams.set('origin', places[0]);
  u.searchParams.set('destination', places[places.length - 1]);
  if (places.length > 2) u.searchParams.set('waypoints', places.slice(1, -1).slice(0, 8).join('|'));
  u.searchParams.set('travelmode', travelMode(t));

}
// a day as a timeline: dot per entry, "go to next stop" links between entries that both have a place
function planList(t, entries, day, opts = {}) {
  const hm = nowHM(), td = today();
  const nextIdx = day === td ? entries.findIndex(p => !p.auto && !p.done && (!p.time || p.time >= hm)) : -1;
  const mode = travelMode(t) === 'driving' ? '開車／叫車' : '大眾運輸';
  let html = '', prev = null;
  entries.forEach((p, i) => {
    const pl = placeOf(t, p);
    if (prev && pl && !p.done) html += `<li class="leg"><span></span><span class="rail"></span><a href="${esc(routeUrl(t, [prev, pl]))}" target="_blank" rel="noopener">→ 前往${esc(p.title.replace(/^(入住|退房) /, ''))} · ${mode} ↗</a></li>`;

const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

function nextPlace(t) {

function sortedFlights(t) { return items(t.flights).sort((a, b) => (a.depart || '').localeCompare(b.depart || '')); }

  const live = t ? (inFabWindow(t) ? t : null) : S.view === 'home' ? (S.trips.find(isOngoing) || S.trips.filter(inFabWindow).sort((a, b) => a.start.localeCompare(b.start))[0]) : null;

  const base = {
    animation: 150, delay: 300, delayOnTouchOnly: true, preventOnFilter: false, ghostClass: 'drag-ghost', chosenClass: 'drag-chosen',
    onStart: () => { S.dragging = true; }

  const done = () => { S.dragging = false; S.lastDragEnd = Date.now(); if (S.renderPending) { S.renderPending = false; render(); } };
  document.querySelectorAll('[data-sortable]').forEach(el => sortables.push(new Sortable(el, {
    ...base, filter: '.check, a', onEnd: () => { saveOrder(el); done(); }

  document.querySelectorAll('[data-shopsort]').forEach(el => sortables.push(new Sortable(el, {

function renderHero(t) {
  const c = country(t), cd = countdown(t), p = progress(t), ph = phase(t);
  const pending = sortedTodos(t).filter(x => !x.done);
  const urgent = pending.filter(x => bucket(x, t) === 'urgent').length;
  const flights = items(t.flights).sort((a, b) => (a.depart || '').localeCompare(b.depart || ''));
  const nextFlight = flights.find(f => (f.depart || '').slice(0, 10) >= today()) || flights[0];
  const stays = items(t.stays).sort((a, b) => (a.checkin || '').localeCompare(b.checkin || ''));
  const nextStay = stays.find(s => (s.checkout || '') >= today()) || stays[0];
  const hid = new Set(S.home.hidden || []);
  const todoAway = hid.has('todo') || isFolded('todo', t);
  const secs = {
    quick: () => quickBar(t, true),
    today: () => {
      if (ph !== 'during') return '';
      const es = dayEntries(t, today()), n = diffDays(today(), t.start) + 1, left = es.filter(x => !x.auto && !x.done).length;
      return hsec('today', t, `今天的行程 · Day ${n}`, `還有 ${left} 項`,
        es.length ? planList(t, es, today()) : `<p class="empty-inline">今天還沒有安排。<button class="btn-sm w" data-act="add-plan" data-trip="${t.id}" data-day="${today()}">點我新增</button></p>`,
        `<button class="btn-sm" data-act="open" data-trip="${t.id}" data-tab="plan">完整行程</button>`);
    },
    money: () => {
      const s = spent(t), lc = c.cur, cl = cashLeft(t);
      return `<div class="msum"><span class="small muted">已花</span><b>${fmtDisp(s.total)}</b>
        ${s.budget ? `<span class="small ${s.total > s.budget ? 'bad-t' : 'muted'}">${s.total > s.budget ? '超支' : '預算剩'}</span><b class="${s.total > s.budget ? 'bad-t' : ''}">${fmtDisp(Math.abs(s.budget - s.total))}</b>` : ''}
        ${lc && cl[lc] != null ? `<span class="small muted">現金</span><b>${esc(cur$(cl[lc], lc))}</b>` : ''}
        <span style="flex:1"></span><button class="btn-sm" data-act="open" data-trip="${t.id}" data-tab="money">記帳明細</button></div>`;
    },
    todo: () => hsec('todo', t, '還沒辦的事', pending.length ? `還有 ${pending.length} 項${urgent ? `，${urgent} 項急件` : ''}` : '全部辦好了',
      pending.length ? `<ul class="cards" ${sortableAttr(t)}>${pending.slice(0, 3).map(x => todoCard(t, x)).join('')}</ul>
        ${pending.length > 3 ? `<button class="btn-sm" style="align-self:flex-start" data-act="open" data-trip="${t.id}" data-tab="todo">還有 ${pending.length - 3} 項 →</button>` : ''}` : `<p class="empty-inline">待辦都完成了，出發吧！</p>`,
      `<button class="btn-sm" data-act="open" data-trip="${t.id}" data-tab="todo">全部待辦</button>`),
    glance: () => hsec('glance', t, '機票與住宿', nextFlight ? `${nextFlight.flightNo || ''} ${fmtDT(nextFlight.depart)}` : '',
      `<div class="glance">
        ${nextFlight ? passHTML(t, nextFlight, true) : `<p class="empty-inline">還沒加機票。<button class="btn-sm w" data-act="${aiText ? 'import' : 'add-flight'}" data-trip="${t.id}">點我新增</button></p>`}
        ${nextStay ? `<div class="card stay">${stayInner(t, nextStay, true)}</div>` : `<p class="empty-inline">還沒加住宿。<button class="btn-sm w" data-act="${aiText ? 'import' : 'add-stay'}" data-trip="${t.id}">點我新增</button></p>`}
      </div>${travelersHTML(t)}`,
      `<button class="btn-sm" data-act="open" data-trip="${t.id}" data-tab="book">全部訂單</button>`)
  };
  return `<section class="card hero">
    <div ${coverAttrs(t)} data-act="open" data-trip="${t.id}" role="button" tabindex="0" aria-label="打開${esc(t.name)}"><div class="hero-main">
      <div class="stamp">${esc(t.country === 'XX' ? '✈' : t.country)}</div>
      <div class="hero-title"><p class="eyebrow">${ph === 'during' ? '旅行中' : '下一趟旅程'}${todoAway && urgent ? ` <button class="chip bad urgent-chip" data-act="urgent" data-trip="${t.id}">${urgent} 項急件</button>` : ''}</p><h1>${esc(t.name)}</h1>
        <p class="muted">${esc([c.name !== '其他' ? c.name : '', t.city].filter(Boolean).join(' · '))}　${fmtD(t.start)}–${fmtD(t.end)} · ${tripDays(t)} 天</p></div>
      <div class="count"><b>${esc(cd.n)}</b><span>${cd.label}</span></div>
    </div></div>
    <div class="hero-acts"><button class="btn primary" data-act="open" data-trip="${t.id}">打開完整旅程</button><button class="btn" data-act="share" data-trip="${t.id}">傳給家人</button></div>
    <div class="progress-row"><div class="progress" role="progressbar" aria-valuenow="${p.pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${p.pct}%"></div></div>
      <p class="small muted">準備進度：已完成 <b class="num">${p.done}</b> / ${p.all} 項${pending.length ? `，還有 ${pending.length} 項沒辦` : '，全部辦好了'}</p></div>
    ${heroOrder(t).filter(k => !hid.has(k)).map(k => secs[k]()).join('')}
  </section>`;
}
function openHomeEdit() {
  const t0 = S.trips.filter(t => t.end >= today()).sort((a, b) => a.start.localeCompare(b.start))[0];
  let order = t0 ? heroOrder(t0) : (S.home.order || Object.keys(HERO_SECS));
  const hid = new Set(S.home.hidden || []);
  let auto = !(S.home.order && S.home.order.length);
  const f = $('#dlgForm');
  const row = (k, label, i, movable) => `<li class="qe-row"><label><input type="checkbox" data-k="${k}" ${hid.has(k) ? '' : 'checked'}>${label}</label>
    ${movable ? `<span><button type="button" class="icon-btn" data-mv="${i}" data-d="-1" aria-label="上移" ${i === 0 ? 'disabled' : ''}>↑</button><button type="button" class="icon-btn" data-mv="${i}" data-d="1" aria-label="下移" ${i === order.length - 1 ? 'disabled' : ''}>↓</button></span>` : ''}</li>`;
  const draw = () => {
    f.innerHTML = `<h2>自訂首頁</h2>
      <p class="small muted">${auto ? '目前是「自動」：出發前待辦在前，旅行中今日行程和花費在前。調整順序後會改用你的順序。' : '目前使用你自訂的順序。'}${S.uid && S.canWrite ? '設定跟著你的帳號，手機和電腦一致。' : '設定只存在這台裝置。'}</p>
      <span class="flabel">下一趟旅程卡片</span>
      <ul class="qe-list">${order.map((k, i) => row(k, HERO_SECS[k], i, true)).join('')}</ul>
      <span class="flabel">首頁其他區塊</span>
      <ul class="qe-list">${Object.entries(HOME_SECS).map(([k, l]) => row(k, l, 0, false)).join('')}</ul>
      <p class="small muted">標題和準備進度固定顯示。待辦就算隱藏，有急件時標題旁仍會出現紅色提醒。</p>
      <div class="dlg-actions">${auto ? '' : '<button type="button" class="btn ghost" id="heAuto" style="margin-right:auto">恢復自動</button>'}<button type="button" class="btn ghost" data-act="dlg-close">取消</button><button type="submit" class="btn primary">儲存</button></div>`;
    f.querySelectorAll('input[data-k]').forEach(cb => { cb.onchange = () => { cb.checked ? hid.delete(cb.dataset.k) : hid.add(cb.dataset.k); }; });
    f.querySelectorAll('[data-mv]').forEach(b => { b.onclick = () => { const i = +b.dataset.mv, j = i + +b.dataset.d; [order[i], order[j]] = [order[j], order[i]]; auto = false; draw(); }; });
    const ab = $('#heAuto'); if (ab) ab.onclick = () => { auto = true; if (t0) order = AUTO_ORDER[phase(t0)].slice(); draw(); };
  };
  draw();
  f.onsubmit = e => {
    e.preventDefault();
    S.home = { ...S.home, order: auto ? null : order, hidden: [...hid] };
    saveHome(); dlg.close(); render();
  };
  dlg.showModal();
}

    <div ${coverAttrs(t)}><div class="hero-main"><div class="stamp">${esc(t.country === 'XX' ? '✈' : t.country)}</div>
      <div class="hero-title"><h1>${esc(t.name)}</h1><p class="muted">${esc([c.name !== '其他' ? c.name : '', t.city].filter(Boolean).join(' · '))}　${fmtD(t.start)}–${fmtD(t.end)} · ${tripDays(t)} 天</p></div>

function todoSwitch(t) {

function packTemplate(t) {
  const m = parseD(t.start).getMonth() + 1, list = [...PACK_BASE, ...(PACK_EXTRA[t.country] || [])];
  if (t.country === 'JP' && (m === 12 || m <= 3)) list.push(...PACK_SEASON.winter);
  if (m >= 6 && m <= 9 || ['VN', 'TH'].includes(t.country)) list.push(...PACK_SEASON.summer);
  const out = {};
  list.forEach(([cat, label], i) => { out['p' + i] = { cat, label, done: false, sort: i }; });
  return out;
}

    <div class="progress"><div style="width:${Math.round(done / pk.length * 100)}%"></div></div>
    ${done < pk.length ? `<div class="pack-grid">${cats.map(c => { const l = pk.filter(x => !x.done && (x.cat || '其他') === c); return l.length ? `<div class="card pack-group"><span class="label">${esc(c)}</span>
      ${l.map(x => packRow(t, x)).join('')}</div>` : ''; }).join('')}</div>` : `<div class="card empty-inline">全部打包好了！</div>`}
    ${doneSec('pack', done, '已打包', `<div class="card pack-group">${pk.filter(x => x.done).map(x => packRow(t, x)).join('')}</div>`,
      `<button class="btn-sm w" style="margin-top:10px" data-act="pack-reset" data-trip="${t.id}">全部取消勾選（回程再對一次）</button>`)}
  </section>`;
}
const packRow = (t, x) => `<div class="pack-row ${x.done ? 'is-done' : ''}"><button class="check" data-act="pack-toggle" data-trip="${t.id}" data-id="${esc(x.id)}" aria-pressed="${!!x.done}" aria-label="${x.done ? '取消' : '已打包'}：${esc(x.label)}">✓</button><span>${esc(x.label)}</span><button class="icon-btn w" data-act="pack-del" data-trip="${t.id}" data-id="${esc(x.id)}" aria-label="刪除：${esc(x.label)}">×</button></div>`;
function renderTodosTab(t, todos) {
  if (S.todoView === 'pack') return renderPackTab(t);
  if (S.todoView === 'shop') return renderShopTab(t);
  const counts = { all: 0, urgent: 0, week: 0, later: 0, done: 0 };
  todos.forEach(x => { const b = bucket(x, t); counts[b]++; if (b !== 'done') counts.all++; }); // 已完成 lives at the bottom now
  if (!FILTERS.some(x => x[0] === S.todoFilter)) S.todoFilter = 'all';
  const f = S.todoFilter, custom = t.todoSort === 'custom';
  const list = todos.filter(x => !x.done && (f === 'all' || bucket(x, t) === f)), doneL = todos.filter(x => x.done);
  return `<section class="stack">${todoSwitch(t)}
    <div class="todo-bar">
      <div class="filters-wrap"><div class="filters" role="tablist" aria-label="待辦狀態">${FILTERS.map(([k, l]) => `<button class="filter ${k === 'urgent' && counts.urgent ? 'has-bad' : ''}" role="tab" aria-selected="${f === k}" data-act="filter" data-f="${k}">${l}<span class="n">${counts[k]}</span></button>`).join('')}</div></div>
      <div class="todo-tools">
        <div class="seg w" role="group" aria-label="排序方式"><button aria-pressed="${!custom}" data-act="sortmode" data-mode="due">依期限</button><button aria-pressed="${custom}" data-act="sortmode" data-mode="custom">自訂順序</button></div>
        <button class="btn-sm w" data-act="add-todo" data-trip="${t.id}">＋ 新增待辦</button>
      </div>
    </div>
    ${custom && list.length > 1 ? hint('drag', '電腦可直接拖曳卡片；手機請按住卡片約 0.3 秒再拖。', 'w') : ''}
    ${list.length ? `<ul class="cards" ${sortableAttr(t)}>${list.map(x => todoCard(t, x)).join('')}</ul>`
      : `<div class="card empty-inline">${f === 'all' ? (todos.length ? '全部辦好了，出發吧！' : '還沒有待辦。') : '這一頁沒有待辦。'}</div>`}
    ${doneSec('todo', doneL.length, '已完成', `<ul class="cards">${doneL.map(x => todoCard(t, x)).join('')}</ul>`)}
  </section>`;
}

function renderBookTab(t) {
  const fl = items(t.flights).sort((a, b) => (a.depart || '').localeCompare(b.depart || ''));
  const st = items(t.stays).sort((a, b) => (a.checkin || '').localeCompare(b.checkin || ''));

    flights: { title: '機票', plain: true, sum: fl.length ? `${fl.length} 班` : '還沒加',
      tools: `<button class="btn w" data-act="add-flight" data-trip="${t.id}">＋ 新增航班</button>`,
      body: fl.length ? fl.map(f => passHTML(t, f)).join('') : `<div class="card empty-inline">還沒加機票，按「＋ 新增航班」新增。存好航班和訂位代號，到機場就不用再翻信箱${aiText && S.canWrite ? `。<br><button class="btn-sm" style="margin-top:8px" data-act="import" data-trip="${t.id}">貼上確認信，自動填好</button>` : '。'}</div>` },
    stays: { title: '住宿', plain: true, sum: st.length ? `${st.length} 間` : '還沒加',
      tools: `<button class="btn w" data-act="add-stay" data-trip="${t.id}">＋ 新增住宿</button>`,
      body: st.length ? st.map(s => `<div class="card stay">${stayInner(t, s)}</div>`).join('') : `<div class="card empty-inline">還沒加住宿，按「＋ 新增住宿」新增。存好地址和訂房編號，「給司機看」才有內容${aiText && S.canWrite ? `。<br><button class="btn-sm" style="margin-top:8px" data-act="import" data-trip="${t.id}">貼上訂房確認信，自動填好</button>` : '。'}</div>` }
  })}</section>`;
}

// ---------- cards each person can fold, hide and reorder (記帳、訂單) ----------
const PAGE_CARDS = {
  money: { total: '總花費', cash: '錢包現金', split: '分帳', daily: '每日花費', cats: '分類', receipts: '收據牆', list: '明細', rates: '匯率換算' },
  book: { import: '貼上確認信', flights: '機票', stays: '住宿' }
};
const PAGE_NAMES = { money: '記帳', book: '訂單' };
const PAGE_HIDDEN = { money: ['receipts'], book: [] }; // 預設隱藏：明細裡已經有收據縮圖
const pageHidden = p => pg(p).hidden || PAGE_HIDDEN[p];
const pg = p => ((S.home.pages || {})[p]) || {};
function pageOrder(p) {
  const all = Object.keys(PAGE_CARDS[p]), o = (pg(p).order || []).filter(k => all.includes(k));
  return [...o, ...all.filter(k => !o.includes(k))];
}
function setPage(p, patch) {
  S.home = { ...S.home, pages: { ...(S.home.pages || {}), [p]: { ...pg(p), ...patch } } };
  saveHome();
}
// cards: { key: { title, sum, tools, body, wide, plain } | false } — false means it doesn't apply to this trip
function pageCards(p, cards) {
  const st = pg(p), hid = new Set(pageHidden(p)), fold = st.folded || {};
  const ks = pageOrder(p).filter(k => cards[k]), shown = ks.filter(k => !hid.has(k)), nh = ks.length - shown.length;
  const one = k => {
    const c = cards[k], f = !!fold[k];
    const head = `<div class="pc-h"><button class="pc-fold" data-act="pc-fold" data-page="${p}" data-k="${k}" aria-expanded="${!f}"><span class="pc-ar" aria-hidden="true">${f ? '▸' : '▾'}</span>${c.title}</button>${f ? (c.sum ? `<span class="pc-sum">${c.sum}</span>` : '') : (c.tools || '')}</div>`;
    return c.plain ? `<section class="stack pc plain wide ${f ? 'folded' : ''}" data-pc="${k}">${head}${f ? '' : c.body}</section>`
      : `<div class="card stack pc ${c.wide ? 'wide' : ''} ${f ? 'folded' : ''}" data-pc="${k}">${head}${f ? '' : c.body}</div>`;
  };
  return `<div class="pc-grid">${shown.map(one).join('')}</div>
    <div class="pc-foot">${nh ? `<span class="small muted">已隱藏 ${nh} 張卡片</span>` : ''}<button class="btn-sm" data-act="page-edit" data-page="${p}">自訂這頁</button></div>`;
}
function openPageEdit(p) {
  let order = pageOrder(p).filter(k => k !== 'import' || aiText);
  const hid = new Set(pageHidden(p));
  const f = $('#dlgForm');
  const draw = () => {
    f.innerHTML = `<h2>自訂「${PAGE_NAMES[p]}」</h2>
      <p class="small muted">勾選要顯示的卡片，用箭頭調整順序。所有旅程都會套用。${S.uid && S.canWrite && !WEB ? '設定跟著你的帳號，手機和電腦一致。' : '設定存在這台裝置。'}</p>
      <ul class="qe-list">${order.map((k, i) => `<li class="qe-row"><label><input type="checkbox" data-k="${k}" ${hid.has(k) ? '' : 'checked'}>${PAGE_CARDS[p][k]}</label>
        <span><button type="button" class="icon-btn" data-mv="${i}" data-d="-1" aria-label="上移：${PAGE_CARDS[p][k]}" ${i === 0 ? 'disabled' : ''}>↑</button><button type="button" class="icon-btn" data-mv="${i}" data-d="1" aria-label="下移：${PAGE_CARDS[p][k]}" ${i === order.length - 1 ? 'disabled' : ''}>↓</button></span></li>`).join('')}</ul>
      <p class="small muted">有些卡片只在需要時出現，例如有旅伴才有「分帳」、有記帳才有「每日花費」。</p>
      <div class="dlg-actions"><button type="button" class="btn ghost" id="peReset" style="margin-right:auto">恢復預設</button><button type="button" class="btn ghost" data-act="dlg-close">取消</button><button type="submit" class="btn primary">儲存</button></div>`;
    f.querySelectorAll('input[data-k]').forEach(cb => { cb.onchange = () => { cb.checked ? hid.delete(cb.dataset.k) : hid.add(cb.dataset.k); }; });
    f.querySelectorAll('[data-mv]').forEach(b => { b.onclick = () => { const i = +b.dataset.mv, j = i + +b.dataset.d; [order[i], order[j]] = [order[j], order[i]]; draw(); }; });
    $('#peReset').onclick = () => { order = Object.keys(PAGE_CARDS[p]).filter(k => k !== 'import' || aiText); hid.clear(); PAGE_HIDDEN[p].forEach(k => hid.add(k)); draw(); };
  };
  draw();
  f.onsubmit = e => { e.preventDefault(); setPage(p, { order, hidden: [...hid] }); dlg.close(); render(); };
  dlg.showModal();
}
// one-line tips: shown until you press 知道了
function hint(k, text, cls = '') {
  if ((S.home.hints || {})[k]) return '';
  return `<p class="small muted hint ${cls}">${text}<button type="button" class="hint-x" data-act="hint-off" data-k="${k}" aria-label="知道了，不再顯示這行說明">知道了 ✕</button></p>`;
}

function planCard(t, p, isNext) {
  const tl = (PLAN_TYPES.find(x => x[0] === p.type) || [])[1] || '其他';
  const map = p.place ? mapUrl(p.place) : '', link = safeUrl(p.link);
  const time = p.time ? p.time + (p.end ? '–' + p.end : '') : '未定';
  const attrs = p.auto ? `data-act="tab" data-trip="${t.id}" data-tab="book" aria-label="查看${p.auto === 'flight' ? '機票' : '住宿'}"`
    : `data-act="edit-plan" data-trip="${t.id}" data-id="${esc(p.id)}" aria-label="編輯：${esc(p.title)}"`;
  const dot = p.auto ? `<span class="dot auto-i" aria-hidden="true">${p.auto === 'flight' ? '✈' : '⌂'}</span>`
    : `<button class="dot" data-act="plan-done" data-trip="${t.id}" data-id="${esc(p.id)}" aria-pressed="${!!p.done}" aria-label="${p.done ? '取消完成' : '標記完成'}：${esc(p.title)}">✓</button>`;
  return `<li class="plan ${p.auto ? 'auto' : ''} ${p.done ? 'is-done' : ''} ${isNext ? 'next' : ''}" ${attrs} tabindex="0">
    <span class="p-time mono">${esc(time)}</span><span class="rail">${dot}</span>
    <div class="p-body"><div class="p-title"><span class="p-type">${tl}</span>${esc(p.title)}</div>
      ${p.note ? `<p class="tc-note">${esc(p.note)}</p>` : ''}
      <div class="tc-meta">${p.resNo ? `<span class="mono">預約 ${esc(p.resNo)}</span>` : ''}${p.cost ? `<span class="num">約 ${esc(cur$(p.cost, p.costCur || 'TWD'))}</span>` : ''}${p.auto ? '<span>自動帶入</span>' : ''}${map ? `<a class="lnk" href="${esc(map)}" target="_blank" rel="noopener">地圖 ↗</a>` : ''}${link ? `<a class="lnk" href="${esc(link)}" target="_blank" rel="noopener">連結 ↗</a>` : ''}</div>
    </div></li>`;
}

function renderPlanTab(t) {
  const days = tripDayList(t);
  if (!days.includes(S.planDay)) S.planDay = days.includes(today()) ? today() : days[0];
  const wish = items(t.plans).filter(p => !p.day).sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  return `<section class="stack">
    <div class="section-h"><h2>每日行程</h2></div>
    ${hint('plan', '點圓圈打勾；點項目可編輯；把項目拖到另一天就能改日期。', 'w')}
    <div class="card wish stack">
      <div class="section-h"><button class="fold" style="border:0;background:none;font:inherit;color:inherit;padding:0;font-weight:700" data-act="wish-toggle" aria-expanded="${S.wishOpen}">${S.wishOpen ? '▾' : '▸'} 想去清單 · ${wish.length} 項</button>
        <button class="btn-sm w" data-act="add-plan" data-trip="${t.id}" data-day="">＋ 新增想去的</button></div>
      ${S.wishOpen ? `${hint('wish', `還沒決定哪天去的店和景點放這裡。${S.canWrite ? '按住拖到某一天，再點開補上時間。' : ''}`)}
        <ul class="plans" ${S.canWrite ? `data-plans="${t.id}" data-day=""` : ''}>${wish.map(p => planCard(t, p)).join('')}</ul>` : ''}
    </div>
    <div class="day-chips" role="tablist">${days.map((d, i) => `<button class="filter" role="tab" aria-selected="${S.planDay === d}" data-act="plan-day" data-day="${d}">Day ${i + 1}<span class="n">${parseD(d).getMonth() + 1}/${parseD(d).getDate()}</span></button>`).join('')}</div>
    <div class="days">${days.map((d, i) => {
      const es = dayEntries(t, d), route = es.filter(p => !p.done).map(p => placeOf(t, p)).filter(Boolean);
      return `<div class="day ${S.planDay === d ? 'sel' : ''}">
        <div class="day-h"><b>Day ${i + 1}</b><span class="muted">${fmtD(d)}</span>${d === today() ? '<span class="chip ok">今天</span>' : ''}<span style="flex:1"></span>${route.length > 1 ? `<a class="lnk" href="${esc(routeUrl(t, route))}" target="_blank" rel="noopener">整天路線 ↗</a>` : ''}</div>
        ${planList(t, es, d, { drag: S.canWrite })}
        ${es.length ? '' : '<p class="small muted">這天還沒有安排</p>'}
        <button class="btn-sm w add-plan" data-act="add-plan" data-trip="${t.id}" data-day="${d}">＋ 新增行程</button>
      </div>`;

const receiptList = e => e.receipts || (e.receipt ? [{ id: e.receipt, type: e.receiptType }] : []);
function receiptImg(e, r, more) {
  const src = blobSrc(r.id);
  return `<a class="thumb-a" href="${src}" target="_blank" rel="noopener">${(r.type || '').startsWith('image/') ? `<img class="thumb" src="${src}" alt="收據：${esc(e.desc || '')}" loading="lazy">` : '<span class="thumb-pdf">PDF</span>'}${more ? `<span class="dbadge">+${more}</span>` : ''}</a>`;
}
function receiptThumb(e) { const l = receiptList(e); return l.length ? receiptImg(e, l[0], l.length - 1) : ''; }
function dispSeg(list) {
  return `<div class="seg" role="group" aria-label="顯示幣別">${list.map(c => `<button aria-pressed="${S.dispCur === c}" data-act="disp-cur" data-cur="${c}">${CURS[c]}</button>`).join('')}</div>`;
}

function renderMoneyTab(t) {
  const ex = items(t.expenses).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));
  let total = 0, missing = 0, todayT = 0; const byCat = {}, byDay = {};
  ex.forEach(e => {
    const v = expTWD(t, e); if (v == null) { missing++; return; }
    total += v; const c = e.category || '其他';
    byCat[c] = (byCat[c] || 0) + v; byDay[e.date] = (byDay[e.date] || 0) + v;
    if (e.date === today()) todayT += v;
  });
  const lc = country(t).cur, ps = people(t);
  const budgetTWD = t.budget && t.budget.amount ? t.budget.amount * (twdPer(t.budget.cur || 'TWD') || 0) : 0;
  const pct = budgetTWD ? total / budgetTWD * 100 : 0;
  const days = tripDayList(t), dayMax = Math.max(1, ...days.map(d => byDay[d] || 0)), catMax = Math.max(1, ...Object.values(byCat));
  const cl = cashLeft(t), moves = ps.length > 1 ? settle(t) : null;
  const shown = ex;
  const receipts = ex.filter(e => receiptList(e).length);
  return `<section class="stack">
    <div class="todo-bar">${isPhone() ? '' : '<h2 style="font-size:17px">記帳</h2>'}
      <div class="todo-tools">${dispSeg([...new Set(['TWD', lc, 'USD'].filter(Boolean))])}${isPhone() && inFabWindow(t) && S.canWrite ? '' : `<button class="btn primary w" data-act="quick" data-trip="${t.id}">＋ 記一筆帳</button>`}</div></div>
    ${pageCards('money', {
      total: { title: '總花費', sum: `${fmtDisp(total)} · 今天 ${fmtDisp(todayT)}`, body: `<div class="big">${fmtDisp(total)}</div>
        <p class="small muted">今天 ${fmtDisp(todayT)} · ${ex.length} 筆${missing ? ` · ${missing} 筆缺匯率未計入` : ''}</p>
        ${budgetTWD ? `<div class="progress ${pct > 100 ? 'over' : ''}"><div style="width:${Math.min(100, pct)}%"></div></div>
          <p class="small ${pct > 100 ? 'bad-t' : 'muted'}">預算 ${fmtDisp(budgetTWD)}，${pct > 100 ? `已超支 ${fmtDisp(total - budgetTWD)}` : `還剩 ${fmtDisp(budgetTWD - total)}`}</p>` : ''}
        <button class="btn-sm w" data-act="set-budget" data-trip="${t.id}" style="align-self:flex-start">${budgetTWD ? '修改預算' : '設定預算'}</button>` },
      cash: { title: '錢包現金', tools: `<button class="btn-sm w" data-act="add-cash" data-trip="${t.id}">＋ 新增換匯</button>`,
        sum: Object.keys(cl).length ? Object.entries(cl).map(([c, v]) => esc(cur$(v, c))).join('、') : '還沒記換匯',
        body: `${Object.keys(cl).length ? Object.entries(cl).map(([c, v]) => `<div class="cash-row"><b class="mono">${esc(cur$(v, c))}</b>${cashRate(t, c) ? `<span class="small muted">實際匯率 1 ${esc(c)} = NT$ ${money(cashRate(t, c), 4)}</span>` : ''}${v < 0 ? '<span class="chip bad" style="align-self:flex-start">現金支出超過換匯金額</span>' : ''}</div>`).join('')
          : '<p class="small muted">記下出發前換了多少外幣，用現金付的帳會自動扣掉，也會用你實際換到的匯率計算。</p>'}
        ${items(t.cash).length ? `<details><summary class="small muted">換匯紀錄 ${items(t.cash).length} 筆</summary>${items(t.cash).map(c => `<div class="cash-ex small"><span>${fmtD(c.date)} 用 ${cur$(c.twd)} 換 ${esc(cur$(c.amount, c.cur))}</span><button class="icon-btn w" type="button" data-act="del-cash" data-trip="${t.id}" data-id="${esc(c.id)}" aria-label="刪除這筆換匯紀錄">×</button></div>`).join('')}</details>` : ''}` },
      split: moves && { title: '分帳',
        sum: moves.length ? `${esc(moves[0][0])} 要給 ${esc(moves[0][1])} ${fmtDisp(moves[0][2])}${moves.length > 1 ? `，還有 ${moves.length - 1} 筆` : ''}` : '不用找錢',
        body: `${moves.length ? moves.map(([a, b, v]) => `<div class="settle"><b>${esc(a)}</b>要給<b>${esc(b)}</b><span class="mono">${fmtDisp(v)}</span></div>`).join('') : '<p class="small muted">目前大家付的剛好，不用找錢。</p>'}
        <p class="small muted">${ps.map(p => `${esc(p)} 付了 ${fmtDisp(sumPaid(t, p))}`).join('、')}</p>` },
      daily: ex.length > 0 && { title: '每日花費', sum: `平均每天 ${fmtDisp(total / Math.max(1, days.length))}`,
        body: `<div class="daybars">${days.map(d => `<div class="db" title="${fmtD(d)} ${fmtDisp(byDay[d] || 0)}"><div class="db-bar"><div style="height:${(byDay[d] || 0) / dayMax * 100}%"></div></div><span class="small muted">${parseD(d).getMonth() + 1}/${parseD(d).getDate()}</span></div>`).join('')}</div>` },
      cats: ex.length > 0 && { title: '分類', sum: (() => { const top = CATS.filter(k => byCat[k]).sort((a, b) => byCat[b] - byCat[a])[0]; return top ? `${top}最多 ${fmtDisp(byCat[top])}` : ''; })(),
        body: `<div class="cat-bars">${CATS.filter(k => byCat[k]).map(k => `<div class="cat-bar"><span>${k}</span><div class="bar"><div style="width:${byCat[k] / catMax * 100}%"></div></div><span class="num">${fmtDisp(byCat[k])}</span></div>`).join('')}</div>` },
      receipts: receipts.length > 0 && { title: '收據牆', wide: true, sum: `${receipts.flatMap(receiptList).length} 張`,
        body: `<div class="rwall">${receipts.flatMap(e => receiptList(e).map(r => receiptImg(e, r))).join('')}</div>` },
      list: { title: '明細', wide: true, sum: `${ex.length} 筆`,
        body: shown.length ? `<div>${shown.map(e => expRow(t, e)).join('')}</div>` : `<p class="empty-inline">${`還沒有記帳。按「＋ 記一筆帳」${aiOK ? '，可以拍收據讓 Claude 幫你填' : ''}。`}</p>` },
      rates: ratesCard(t)
    })}
  </section>`;
}

function expRow(t, e) {
  const v = expTWD(t, e);

// draw one big-type card; rows are [text, size, colour?, weight?]
function drawCard(title, rows, accent) {
  const W = 1080, pad = 64, cv = document.createElement('canvas'), g = cv.getContext('2d');
  const font = (sz, w) => `${w || 500} ${sz}px "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif`;
  const lines = [];
  rows.forEach(([txt, sz, col, w]) => {
    g.font = font(sz, w); let cur = '';
    [...String(txt)].forEach(ch => { if (g.measureText(cur + ch).width > W - pad * 2) { lines.push([cur, sz, col, w]); cur = ch; } else cur += ch; });
    lines.push([cur, sz, col, w]);
  });
  const H = Math.ceil(170 + lines.reduce((h, l) => h + l[1] * 1.45, 0) + pad);
  cv.width = W; cv.height = H;
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, W, H);
  g.fillStyle = accent; g.fillRect(0, 0, W, 130);
  g.fillStyle = '#FFFFFF'; g.font = font(56, 700); g.textBaseline = 'middle'; g.fillText(title, pad, 66, W - pad * 2);
  let y = 170; g.textBaseline = 'top';
  lines.forEach(([txt, sz, col, w]) => { g.font = font(sz, w); g.fillStyle = col || '#111111'; g.fillText(txt, pad, y); y += sz * 1.45; });
  return cv.toDataURL('image/png');
}
async function buildCards(t) {

  card.innerHTML = '<p class="ai-status">Claude 正在認照片裡的商品…</p>';

  try {
    const r = await sample.json(`這是旅行者想在國外買的商品照片（可能是包裝正反面、網頁或社群截圖；多張照片是同一樣商品）。請認出是什麼商品，只回覆一個 JSON 物件：

認不出來就回覆 {"ok": false}。`, { images: files, modelTier: 'quick' });
    if (!card.isConnected) return;
    if (form.querySelector('#shopAi') !== card) return;
    const zh = r && r.ok && typeof r.zh === 'string' ? r.zh.trim().slice(0, 40) : '';
    if (nameEl.value.trim()) { card.remove(); return; } // you typed a name meanwhile
    if (!zh) { card.innerHTML = '<p class="small muted">Claude 認不出這是什麼，請自己填名稱。</p>'; return; }
    const local = lang && typeof r.local === 'string' ? r.local.trim().slice(0, 80) : '';

    card.querySelector('[data-ai="no"]').onclick = () => card.remove();
  } catch (e) {
    if (card.isConnected) card.innerHTML = `<p class="small muted">${e && e.code === 'rate_limited' ? '使用太頻繁了，請稍後再試。' : 'Claude 認不出這張照片，請自己填名稱。'}</p>`;

function buildTodos(cc) {
  const out = {};
  [...COMMON, ...(EXTRA[cc] || [])].forEach(([key, label, offset, cat, link, note], i) => {
    out[key] = { label, offset, cat, link: link || '', note: key === 'cash' ? (CASH_NOTE[cc] || '') : (note || ''), done: false, order: i };
  });
  return out;
}

  if (c === 'quota_exceeded' || c === 'quota_or_state') return '儲存空間已滿，請刪除一些舊資料或收據。';
  if (c === 'too_large') return '檔案太大（上限 20 MB），請壓縮後再試。';
  if (c === 'unsupported_type') return '只支援圖片（JPG、PNG、WebP）或 PDF。';
