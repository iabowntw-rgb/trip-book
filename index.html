// ---------- 網頁版：資料存在這台裝置 ----------
// 和 claude.ai 的資料庫同樣的用法（doc / collection / set / update / delete / onSnapshot），所以其他程式不用改
const LDB = (() => {
  const KEY = 'tb.web.db';
  let data = {};
  const load = () => { try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch { data = {}; } };
  load();
  const subs = new Set();
  const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const merge = (a, b) => { const o = isObj(a) ? { ...a } : {}; for (const [k, v] of Object.entries(b)) o[k] = isObj(v) ? merge(o[k], v) : v; return o; };
  const notify = () => subs.forEach(f => { try { f(); } catch { } }); // 立刻通知（和雲端版一樣），連續兩次寫入才不會互相蓋掉
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch { load(); throw userErr('這台裝置的儲存空間滿了，存不進去。請先按首頁下方的「備份」，再刪掉用不到的旅程。'); }
    notify();
  };
  const docSnap = path => ({ id: path.split('/').pop(), exists: path in data, data: () => clone(data[path]) });
  const colSnap = col => {
    const docs = Object.keys(data).filter(k => k.startsWith(col + '/') && !k.slice(col.length + 1).includes('/')).map(docSnap);
    return { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false } };
  };
  const listen = (make, fn) => { const f = () => fn(make()); subs.add(f); setTimeout(f); return () => subs.delete(f); };
  const doc = path => ({
    id: path.split('/').pop(),
    get: async () => docSnap(path),
    set: async d => { const old = data[path]; data[path] = clone(d); try { save(); } catch (e) { data[path] = old; throw e; } },
    update: async d => { if (!(path in data)) throw Object.assign(new Error('not found'), { code: 'not_found' }); const old = data[path]; data[path] = merge(data[path], clone(d)); try { save(); } catch (e) { data[path] = old; throw e; } },
    delete: async () => { delete data[path]; save(); },
    onSnapshot: fn => listen(() => docSnap(path), fn)
  });
  // 另一個分頁改了資料，這裡也跟著更新
  addEventListener('storage', e => { if (e.key === KEY) { load(); notify(); } });
  return {
    doc, collection: col => ({ doc: id => doc(col + '/' + id), onSnapshot: fn => listen(() => colSnap(col), fn) }),
    dump: () => clone(data),
    replace: d => { const old = data; data = clone(d) || {}; try { save(); } catch (e) { data = old; throw e; } }
  };
})();

// 照片和收據存在 IndexedDB（比 localStorage 大很多）
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((ok, no) => {
    const r = indexedDB.open('tb-web', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('blobs');
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
  const tx = async (mode, fn) => { const d = await open(); return new Promise((ok, no) => { const t = d.transaction('blobs', mode); const st = t.objectStore('blobs'); const out = fn(st); t.oncomplete = () => ok(out && out.result); t.onerror = () => no(t.error); }); };
  return {
    put: (id, blob) => tx('readwrite', st => st.put(blob, id)),
    all: async () => { const d = await open(); return new Promise((ok, no) => { const out = {}; const r = d.transaction('blobs').objectStore('blobs').openCursor(); r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else ok(out); }; r.onerror = () => no(r.error); }); },
    clear: () => tx('readwrite', st => st.clear())
  };
})();
// 手機拍的照片很大：縮到最長邊 1600 再存，收據一樣看得清楚
async function shrinkImg(file) {
  if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type || '')) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 600000) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
    return b && b.size < file.size ? b : file;
  } catch { return file; }
}
const webAssets = {
  upload: async (file, opt) => {
    const b0 = await shrinkImg(file), type = b0 === file ? ((opt && opt.type) || file.type || 'application/octet-stream') : 'image/jpeg';
    const blob = b0.type === type ? b0 : new Blob([b0], { type });
    const id = [...crypto.getRandomValues(new Uint8Array(16))].map(x => x.toString(16).padStart(2, '0')).join('');
    await IDB.put(id, blob);
    BLOBS[id] = URL.createObjectURL(blob);
    return { id, url: BLOBS[id], contentType: type, sizeBytes: blob.size };
  }
};
// 存檔：手機會跳出分享選單（可以傳到 LINE 或存到檔案），電腦直接下載
async function saveFile(filename, data) {
  const f = new File([data], filename, { type: data.type || 'application/octet-stream' });
  if (navigator.canShare && navigator.canShare({ files: [f] }) && matchMedia('(pointer: coarse)').matches) {
    try { await navigator.share({ files: [f], title: filename }); return; } catch (e) { if (e && e.name === 'AbortError') throw e; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = filename;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}
const webDownloads = { save: ({ filename, data }) => saveFile(filename, data) };

// 匯率：網頁版自己抓（免費、不用金鑰），半天更新一次，每天留一筆紀錄
async function webRates() {
  const KEY = 'tb.web.rates', old = loadPref(KEY);
  if (old) { S.rates = old; render(); }
  if (old && Date.now() - new Date(old.updatedAt).getTime() < 12 * 3600e3) return;
  try {
    const j = await (await fetch('https://open.er-api.com/v6/latest/TWD')).json();
    if (!j || j.result !== 'success' || !j.rates) return;
    const at = new Date((j.time_last_update_unix || Date.now() / 1000) * 1000), date = ymd(at);
    const pick = ['JPY', 'THB', 'VND', 'USD'].reduce((o, c) => (o[c] = j.rates[c], o), { date });
    const history = ((old && old.history) || []).filter(h => h.date !== date).concat([pick]).slice(-30);
    S.rates = { rates: j.rates, updatedAt: at.toISOString(), source: 'open.er-api.com', history };
    savePref(KEY, S.rates); render();
  } catch { }
}

const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isPhoneUA = () => isIOS() || /Android/.test(navigator.userAgent);
function webTop() {
  if (isStandalone() || !isPhoneUA() || loadPref('tb.web.a2hs')) return '';
  const steps = isIOS() ? '用 <b>Safari</b> 打開這頁 → 點下方的「分享」<span aria-hidden="true">（方框加向上箭頭）</span> → 往下滑點「<b>加入主畫面</b>」。'
    : '用 <b>Chrome</b> 打開這頁 → 點右上角「<b>⋮</b>」→「<b>加到主畫面</b>」或「安裝應用程式」。';
  return `<div class="card web-a2hs"><h2>先把旅程本加到主畫面</h2>
    <p>${isIOS() ? 'iPhone 會清掉太久沒打開的網頁資料，加到主畫面就不會。' : '以後點桌面圖示就能直接打開，沒網路也能看。'}</p>
    <p>${steps}</p>
    <div class="dlg-actions"><button class="btn" data-act="web-a2hs-ok">我加好了</button></div></div>`;
}
function webBottom() {
  if ((S.home.hidden || []).includes('backup')) return '';
  const last = loadPref('tb.web.backupAt'), age = last ? diffDays(today(), last) : null;
  const late = S.trips.length && (age == null || age > 30);
  const sum = `<span class="${late ? 'bad-t' : ''}">${last ? `上次備份 ${fmtD(last)}${late ? `，已經 ${age} 天` : ''}` : (S.trips.length ? '還沒備份過' : '')}</span>`;
  return `<section class="card web-backup">${hsec('backup', null, '資料備份', sum, `
    <p class="small">旅程本的資料只存在<b>這台${isPhoneUA() ? '手機' : '裝置'}</b>裡。換手機或清除瀏覽器資料前，先按「備份」存成一個檔案（可以傳到自己的 LINE 保存），之後用「還原」讀回來。</p>
    <p class="small ${late ? 'bad-t' : 'muted'}">${last ? `上次備份：${fmtD(last)}` : '還沒備份過'}</p>
    <div class="tm-acts"><button class="btn primary" data-act="web-backup">備份</button><button class="btn" data-act="web-restore">還原</button></div>`)}</section>`;
}
const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => no(r.error); r.readAsDataURL(blob); });
async function webBackup() {
  toast('正在準備備份檔…');
  const blobs = await IDB.all(), out = {};
  for (const [id, b] of Object.entries(blobs)) out[id] = { type: b.type, data: await b64(b) };
  const all = { app: 'trip-book', v: 1, at: new Date().toISOString(), db: LDB.dump(), blobs: out,
    prefs: { home: loadPref('tb.home'), disp: loadPref('tb.disp') } };
  try { await saveFile(`旅程本備份-${today()}.json`, new Blob([JSON.stringify(all)], { type: 'application/json' })); }
  catch (e) { toast('沒有存備份。'); return; }
  savePref('tb.web.backupAt', today()); toast('備份檔存好了，記得把它放在找得到的地方。'); render();
}
function webRestorePick() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let j = null; try { j = JSON.parse(await f.text()); } catch { }
    if (!j || j.app !== 'trip-book' || !j.db) { toast('這不是旅程本的備份檔。'); return; }
    const n = Object.keys(j.db).filter(k => k.startsWith('trips/')).length;
    confirmBox('用備份還原？', `備份檔裡有 ${n} 趟旅程（${String(j.at || '').slice(0, 10)} 備份）。還原後，這台裝置上現在的資料會被備份檔取代。`, '還原', async () => {
      await IDB.clear(); Object.keys(BLOBS).forEach(k => { URL.revokeObjectURL(BLOBS[k]); delete BLOBS[k]; });
      for (const [id, x] of Object.entries(j.blobs || {})) {
        const blob = await (await fetch(`data:${x.type || 'application/octet-stream'};base64,${x.data}`)).blob();
        await IDB.put(id, blob); BLOBS[id] = URL.createObjectURL(blob);
      }
      LDB.replace(j.db);
      if (j.prefs && j.prefs.home) { S.home = { order: null, hidden: [], collapsed: {}, ...j.prefs.home }; savePref('tb.home', S.home); }
      S.view = 'home'; toast('還原好了。');
    });
  };
  inp.click();
}
async function webBoot() {
  db = LDB; user = null; assets = webAssets; sample = null; downloads = webDownloads; S.uid = 'me';
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch { }
  try { Object.entries(await IDB.all()).forEach(([id, b]) => BLOBS[id] = URL.createObjectURL(b)); } catch { }
  webRates();
}

// ---------- boot ----------
async function resolveNames() {
  if (!user) return;
  const ids = new Set();
  S.trips.forEach(t => items(t.todos).forEach(x => { if (x.doneBy && !(x.doneBy in S.names)) ids.add(x.doneBy); }));
  Object.keys(S.shop || {}).forEach(u => { if (u !== S.uid && !(u in S.names)) ids.add(u); });
  if (!ids.size) return;
  const list = [...ids]; list.forEach(i => S.names[i] = '');
  try { const ps = await user.profiles(list); list.forEach(i => S.names[i] = (ps && ps[i] && ps[i].name) || '旅伴'); render(); } catch { }
}

(async () => {
  const timer = setTimeout(() => { if (!S.loaded) { S.slow = true; render(); } }, 10000);
  if (WEB) await webBoot();
  else [db, user, assets, sample, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('sample'), use('downloads')]);
  aiText = !!sample;
  if (sample) { try { const lim = await sample.limits(); aiOK = !!(lim && lim.images); } catch { aiOK = false; } }
  if (!db) { S.noDb = true; clearTimeout(timer); render(); return; }
  if (user) {
    try { S.uid = await user.id(); } catch { }
    try { const cw = await user.can('data.write'); if (cw === false) S.canWrite = false; } catch { }
  }
  db.collection('trips').onSnapshot(snap => {
    S.trips = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.start && t.end);
    if (!snap.metadata.fromCache || snap.size) { if (!S.loaded) setTimeout(maybeHint, 1500); S.loaded = true; S.slow = false; }
    if (!snap.metadata.fromCache) clearTimeout(timer);
    if (S.view === 'trip' && !trip(S.tripId)) S.view = 'home';
    render(); resolveNames();
  }, err => { S.loaded = true; clearTimeout(timer); render(); toast('讀取旅程失敗，請重新整理頁面。'); });
  // home layout follows the person across devices
  if (S.uid) db.doc('prefs/' + S.uid).onSnapshot(s => {
    if (!s.exists) return;
    S.home = { order: null, hidden: [], collapsed: {}, ...s.data() }; savePref('tb.home', S.home); render();
  }, () => { });
  db.collection('shop').onSnapshot(snap => {
    S.shop = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); render(); resolveNames();
  }, () => { });
  if (!WEB) db.doc('settings/rates').onSnapshot(s => { S.rates = s.exists ? s.data() : null; render(); }, () => { });
})();
</script>
